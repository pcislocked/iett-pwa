<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="İstanbul gerçek zamanlı otobüs takip" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>iett-pwa</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('iett-pwa-theme');
          var isLight = saved === 'light' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
          var theme = isLight ? 'light' : (saved === 'dark' ? 'dark' : 'amoled');
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
        try {
          var ua = navigator.userAgent || '';
          if (/iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
            document.documentElement.setAttribute('data-ios', 'true');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--color-bg)] text-[var(--color-text-1)] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
